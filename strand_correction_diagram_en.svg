<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    ALLCools Strand Correction Mechanism Comparison
  </text>
  
  <!-- Original DNA Double Strand Structure -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="1100" height="80" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="5"/>
    <text x="20" y="25" font-size="16" font-weight="bold" fill="#2c3e50">Original DNA Double Strand Structure</text>
    <text x="20" y="45" font-size="14" font-family="monospace" fill="#e74c3c">
      5'-ATCGATCG-3'  (Plus strand, after C→T conversion: ATCGATCG → ATTGATTG)
    </text>
    <text x="20" y="65" font-size="14" font-family="monospace" fill="#3498db">
      3'-TAGCTAGC-5'  (Minus strand, after G→A conversion: TAGCTAGC → TAACTAGC)
    </text>
  </g>
  
  <!-- Bismark Processing Method -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="530" height="200" fill="#ffe6e6" stroke="#dc3545" stroke-width="2" rx="5"/>
    <text x="20" y="25" font-size="16" font-weight="bold" fill="#dc3545">Bismark Processing Method</text>
    
    <text x="20" y="50" font-size="12" font-weight="bold" fill="#2c3e50">Forced strand assignment:</text>
    <text x="20" y="70" font-size="12" fill="#e74c3c">• C→T converted reads → Forced to map to plus strand (+)</text>
    <text x="20" y="85" font-size="12" fill="#3498db">• G→A converted reads → Forced to map to minus strand (-)</text>
    
    <text x="20" y="110" font-size="12" font-weight="bold" fill="#2c3e50">Tag marking:</text>
    <text x="20" y="130" font-size="11" font-family="monospace" fill="#495057">XG="CT" → C→T conversion</text>
    <text x="20" y="145" font-size="11" font-family="monospace" fill="#495057">XG="GA" → G→A conversion</text>
    
    <text x="20" y="170" font-size="12" font-weight="bold" fill="#28a745">Advantages:</text>
    <text x="20" y="185" font-size="11" fill="#495057">Consistent strand orientation, simple analysis</text>
  </g>
  
  <!-- Hisat-3n Processing Method -->
  <g transform="translate(620, 170)">
    <rect x="0" y="0" width="530" height="200" fill="#e6f3ff" stroke="#007bff" stroke-width="2" rx="5"/>
    <text x="20" y="25" font-size="16" font-weight="bold" fill="#007bff">Hisat-3n Processing Method</text>
    
    <text x="20" y="50" font-size="12" font-weight="bold" fill="#2c3e50">Maintain original orientation:</text>
    <text x="20" y="70" font-size="12" fill="#495057">• R1/R2 maintain original mapping orientation</text>
    <text x="20" y="85" font-size="12" fill="#495057">• Same conversion type may have different strand orientations</text>
    
    <text x="20" y="110" font-size="12" font-weight="bold" fill="#2c3e50">Tag marking:</text>
    <text x="20" y="130" font-size="11" font-family="monospace" fill="#495057">YZ="+" → C→T conversion</text>
    <text x="20" y="145" font-size="11" font-family="monospace" fill="#495057">YZ="-" → G→A conversion</text>
    
    <text x="20" y="170" font-size="12" font-weight="bold" fill="#ffc107">Problem:</text>
    <text x="20" y="185" font-size="11" fill="#495057">Inconsistent strand orientation, complex analysis</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 600 390 L 600 430" stroke="#28a745" stroke-width="4" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- ALLCools Solution -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="1100" height="180" fill="#e8f5e8" stroke="#28a745" stroke-width="3" rx="5"/>
    <text x="20" y="25" font-size="18" font-weight="bold" fill="#28a745">ALLCools Unified Strand Orientation Solution</text>
    
    <text x="20" y="55" font-size="14" font-weight="bold" fill="#2c3e50">_convert_bam_strandness function logic:</text>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="1060" height="90" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="3"/>
      <text x="10" y="20" font-size="12" font-family="monospace" fill="#495057">
        if read.has_tag("YZ"):  # Hisat-3n
      </text>
      <text x="30" y="35" font-size="12" font-family="monospace" fill="#495057">
        is_ct_func = _is_read_ct_conversion_hisat3n
      </text>
      <text x="10" y="50" font-size="12" font-family="monospace" fill="#495057">
        elif read.has_tag("XG"):  # Bismark
      </text>
      <text x="30" y="65" font-size="12" font-family="monospace" fill="#495057">
        is_ct_func = _is_read_ct_conversion_bismark
      </text>
      <text x="10" y="80" font-size="12" font-family="monospace" fill="#28a745">
        # Unified setting: C→T conversion→plus strand(+), G→A conversion→minus strand(-)
      </text>
    </g>
  </g>
  
  <!-- Arrow -->
  <path d="M 600 650 L 600 690" stroke="#6f42c1" stroke-width="4" marker-end="url(#arrowhead2)" fill="none"/>
  
  <!-- Impact on mpileup Analysis -->
  <g transform="translate(50, 710)">
    <rect x="0" y="0" width="1100" height="140" fill="#f3e5f5" stroke="#6f42c1" stroke-width="2" rx="5"/>
    <text x="20" y="25" font-size="16" font-weight="bold" fill="#6f42c1">Impact on mpileup Analysis After Unification</text>
    
    <g transform="translate(20, 40)">
      <text x="0" y="20" font-size="14" font-weight="bold" fill="#2c3e50">C site analysis (Reference base=C):</text>
      <text x="20" y="40" font-size="12" fill="#e74c3c">• Only count plus strand reads: "." (unmethylated), "T" (methylated)</text>
      
      <text x="500" y="20" font-size="14" font-weight="bold" fill="#2c3e50">G site analysis (Reference base=G):</text>
      <text x="520" y="40" font-size="12" fill="#3498db">• Only count minus strand reads: "," (unmethylated), "a" (methylated)</text>
      
      <text x="0" y="70" font-size="13" font-weight="bold" fill="#28a745">Advantages:</text>
      <text x="90" y="70" font-size="12" fill="#495057">Multi-aligner compatibility | Unified analysis workflow | Auto-detection | Data integrity</text>
      
      <text x="0" y="95" font-size="13" font-weight="bold" fill="#dc3545">Note:</text>
      <text x="60" y="95" font-size="12" fill="#495057">Requires conversion tags(XG/YZ) | Additional processing steps | Only supports Bismark and Hisat-3n</text>
    </g>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#28a745"/>
    </marker>
    <marker id="arrowhead2" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6f42c1"/>
    </marker>
  </defs>
</svg>