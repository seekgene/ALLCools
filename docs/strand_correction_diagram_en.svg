	<text transform="matrix(1 0 0 1 20 25)" class="st15 st1 st21">ALLCools Unified Strand Orientation Solution</text>
	<text transform="matrix(1 0 0 1 20 55)" class="st0 st1 st7">_convert_bam_strandness function logic:</text>
	<g transform="translate(20, 70)">
		<path class="st22" d="M3,0h1054c1.7,0,3,1.3,3,3v84c0,1.7-1.3,3-3,3H3c-1.7,0-3-1.3-3-3V3C0,1.3,1.3,0,3,0z"/>
		<text transform="matrix(1 0 0 1 10 20)" class="st13 st6 st11">if read.has_tag(&quot;YZ&quot;): # Hisat-3n</text>
		<text transform="matrix(1 0 0 1 30 35)" class="st13 st6 st11">is_ct_func = _is_read_ct_conversion_hisat3n</text>
		<text transform="matrix(1 0 0 1 10 50)" class="st13 st6 st11">elif read.has_tag(&quot;XG&quot;): # Bismark</text>
		<text transform="matrix(1 0 0 1 30 65)" class="st13 st6 st11">is_ct_func = _is_read_ct_conversion_bismark</text>
		<text transform="matrix(1 0 0 1 10 80)" class="st15 st6 st11"># Unified setting: C→T conversion→plus strand(+), G→A conversion→minus strand(-)</text>
	</g>
</g>
