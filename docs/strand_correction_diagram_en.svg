	<text transform="matrix(1 0 0 1 20 25)" class="st23 st1 st4">Impact on mpileup Analysis After Unification</text>
	<g transform="translate(20, 40)">
		<text transform="matrix(1 0 0 1 0 20)" class="st0 st1 st7">C site analysis (Reference base=C):</text>
		<text transform="matrix(1 0 0 1 20 40)" class="st25"><tspan x="0" y="0" class="st5 st12 st11">• Only count plus strand reads: &quot;.&quot; (methylated), &quot;T&quot; (</tspan><tspan x="278.7" y="0" class="st5 st26 st11">un</tspan><tspan x="291.2" y="0" class="st5 st12 st11">methylated)</tspan></text>
		<text transform="matrix(1 0 0 1 500 20)" class="st0 st1 st7">G site analysis (Reference base=G):</text>
		<text transform="matrix(1 0 0 1 520 40)" class="st8 st12 st11">• Only count minus strand reads: &quot;,&quot; (methylated), &quot;a&quot; (unmethylated)</text>
		<text transform="matrix(1 0 0 1 0 70)" class="st15 st1 st27">Advantages:</text>
		<text transform="matrix(1 0 0 1 90 70)" class="st13 st12 st11">Multi-aligner compatibility | Unified analysis workflow | Auto-detection | Data integrity</text>
		<text transform="matrix(1 0 0 1 0 95)" class="st10 st1 st27">Note:</text>
		<text transform="matrix(1 0 0 1 60 95)" class="st13 st12 st11">Requires conversion tags(XG/YZ) | Additional processing steps | Only supports Bismark and Hisat-3n</text>
