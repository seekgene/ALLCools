<text transform="matrix(1 0 0 1 295.9629 30)" class="st0 st1 st2">ALLCools Strand Correction Mechanism Comparison</text>
<g transform="translate(50, 60)">
	<path class="st3" d="M5,0h1090c2.8,0,5,2.2,5,5v70c0,2.8-2.2,5-5,5H5c-2.8,0-5-2.2-5-5V5C0,2.2,2.2,0,5,0z"/>
	<text transform="matrix(1 0 0 1 20 25)" class="st0 st1 st4">Original DNA Double Strand Structure</text>
	<text transform="matrix(1 0 0 1 20 45)" class="st5 st6 st7">5&apos;-ATCGATCG-3&apos; (Plus strand, after C→T conversion: ATCGATCG → ATTGATTG)</text>
	<text transform="matrix(1 0 0 1 20 65)" class="st8 st6 st7">3&apos;-TAGCTAGC-5&apos; (Minus strand, after G→A conversion: TAGCTAGC → TAACTAGC)</text>
</g>
<g transform="translate(50, 170)">
	<path class="st9" d="M5,0h520c2.8,0,5,2.2,5,5v190c0,2.8-2.2,5-5,5H5c-2.8,0-5-2.2-5-5V5C0,2.2,2.2,0,5,0z"/>
	<text transform="matrix(1 0 0 1 20 25)" class="st10 st1 st4">Bismark Processing Method</text>
	<text transform="matrix(1 0 0 1 20 50)" class="st0 st1 st11">Forced strand assignment:</text>
	<text transform="matrix(1 0 0 1 20 70)" class="st5 st12 st11">• C→T converted reads → Forced to map to plus strand (+)</text>
	<text transform="matrix(1 0 0 1 20 85)" class="st8 st12 st11">• G→A converted reads → Forced to map to minus strand (-)</text>
	<text transform="matrix(1 0 0 1 20 110)" class="st0 st1 st11">Tag marking:</text>
	<text transform="matrix(1 0 0 1 20 130)" class="st13 st6 st14">XG=&quot;CT&quot; → C→T conversion</text>
	<text transform="matrix(1 0 0 1 20 145)" class="st13 st6 st14">XG=&quot;GA&quot; → G→A conversion</text>
	<text transform="matrix(1 0 0 1 20 170)" class="st15 st1 st11">Advantages:</text>
	<text transform="matrix(1 0 0 1 20 185)" class="st13 st12 st14">Consistent strand orientation, simple analysis</text>
</g>
<g transform="translate(620, 170)">
	<path class="st16" d="M5,0h520c2.8,0,5,2.2,5,5v190c0,2.8-2.2,5-5,5H5c-2.8,0-5-2.2-5-5V5C0,2.2,2.2,0,5,0z"/>
	<text transform="matrix(1 0 0 1 20 25)" class="st17 st1 st4">Hisat-3n Processing Method</text>
	<text transform="matrix(1 0 0 1 20 50)" class="st0 st1 st11">Maintain original orientation:</text>
	<text transform="matrix(1 0 0 1 20 70)" class="st13 st12 st11">• R1/R2 maintain original mapping orientation</text>
	<text transform="matrix(1 0 0 1 20 85)" class="st13 st12 st11">• Same conversion type may have different strand orientations</text>
	<text transform="matrix(1 0 0 1 20 110)" class="st0 st1 st11">Tag marking:</text>
	<text transform="matrix(1 0 0 1 20 130)" class="st13 st6 st14">YZ=&quot;+&quot; → C→T conversion</text>
	<text transform="matrix(1 0 0 1 20 145)" class="st13 st6 st14">YZ=&quot;-&quot; → G→A conversion</text>
	<text transform="matrix(1 0 0 1 20 170)" class="st18 st1 st11">Problem:</text>
	<text transform="matrix(1 0 0 1 20 185)" class="st13 st12 st14">Inconsistent strand orientation, complex analysis</text>
</g>
